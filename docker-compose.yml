services:

# ── Django Application ────────────────────────────────
  web:
    build: .
    container_name: kevidtech_web
    restart: always
    env_file: .env
    entrypoint: /entrypoint.sh
    environment:
      - SERVICE=web
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - kevidtech_network
    expose:
      - "8000"

  # ── PostgreSQL Database ───────────────────────────────
  db:
    image: postgres:16
    container_name: kevidtech_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB:       ${DATABASE_NAME}
      POSTGRES_USER:     ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kevidtech_network

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kevidtech_redis
    restart: always
    networks:
      - kevidtech_network

  # ── Celery Worker ─────────────────────────────────────
  celery:
    build: .
    container_name: kevidtech_celery
    restart: always
    env_file: .env
    entrypoint: /entrypoint.sh
    command: celery -A wifiportal worker --loglevel=info
    volumes:
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - kevidtech_network

  # ── Celery Beat ───────────────────────────────────────
  celery_beat:
    build: .
    container_name: kevidtech_celery_beat
    restart: always
    env_file: .env
    entrypoint: /entrypoint.sh
    command: celery -A wifiportal beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - kevidtech_network

# ── Nginx ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kevidtech_nginx
    restart: always
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - kevidtech_network

  # ── Certbot (SSL) ─────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: kevidtech_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot
             --email admin@kevidtechhotspot.com
             --agree-tos --no-eff-email
             -d kevidtechhotspot.com
             -d www.kevidtechhotspot.com

# ── Volumes ───────────────────────────────────────────
volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
  certbot_certs:
  certbot_www:

# ── Networks ──────────────────────────────────────────
networks:
  kevidtech_network:
    driver: bridge