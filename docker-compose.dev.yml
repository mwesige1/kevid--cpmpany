services:

  web:
    build: .
    container_name: kevidtech_web
    restart: always
    env_file: .env
    entrypoint: /entrypoint.sh
    environment:
      - SERVICE=web
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - ./templates:/app/templates
      - ./static:/app/static
      - ./portal:/app/portal
      - ./dashboard:/app/dashboard
      - ./payments:/app/payments
      - ./network:/app/network
      - ./wifi_sessions:/app/wifi_sessions
      - ./wifiportal:/app/wifiportal
    depends_on:
      - db
      - redis
    networks:
      - kevidtech_network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/dashboard/login/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  db:
    image: postgres:16
    container_name: kevidtech_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB:       ${DATABASE_NAME}
      POSTGRES_USER:     ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kevidtech_network

  redis:
    image: redis:7-alpine
    container_name: kevidtech_redis
    restart: always
    networks:
      - kevidtech_network

  celery:
    build: .
    container_name: kevidtech_celery
    restart: always
    env_file: .env
    entrypoint: /entrypoint.sh
    command: celery -A wifiportal worker --loglevel=info
    volumes:
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - kevidtech_network

  celery_beat:
    build: .
    container_name: kevidtech_celery_beat
    restart: always
    env_file: .env
    entrypoint: /entrypoint.sh
    command: celery -A wifiportal beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - kevidtech_network

  nginx:
    image: nginx:alpine
    container_name: kevidtech_nginx
    restart: always
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - media_volume:/app/media
    depends_on:
      web:
        condition: service_healthy
    networks:
      - kevidtech_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  kevidtech_network:
    driver: bridge